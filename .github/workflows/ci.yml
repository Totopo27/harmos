name: Harmos CI

on:
  push:
    branches: [ main, "feat/**", "fix/**", "chore/**", "docs/**", "audit-*" ]
  pull_request:
    branches: [ main, "feat/**", "chore/**" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  guardrail-and-tests:
    name: Guardrail & Tests (${{ matrix.os }}, Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.11", "3.12" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev

      - name: Set up MSVC (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run Static Code Quality (Ruff)
        run: ruff check core/ scripts/ tests/

      - name: Run Harmos Guardrail (Tests + Schemas + Privacy)
        run: python scripts/check.py

      # check.py already runs the full suite; measure coverage once instead of per matrix cell.
      - name: Run Test Coverage (Coverage.py)
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          coverage run -m unittest discover tests
          coverage report

      - name: Harvest Wilson test cases
        run: |
          python -m core.compiler.cli harvest --suite wilson --out cases_wilson.jsonl

      - name: Run Headless C++ Semantic Differential Oracle
        run: |
          python -m core.compiler.cli diff cases_wilson.jsonl --cpp-kernel benchmarks/teclados-wilson/wilson_kernel.hpp --kernel-class wilson

      - name: Run End-to-End IR to Max Package Compilation
        run: |
          python -m core.compiler.cli benchmarks/midiControl/micro_mpe_ir.json --out build_e2e/micro_mpe_pkg --no-build

      - name: Run Performance Budget Benchmark
        run: |
          python scripts/bench.py --json
